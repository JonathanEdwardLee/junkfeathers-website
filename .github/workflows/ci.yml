name: Astro Machine CI

on:
  push:
    branches:
      - main
      - 'task/*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: astro-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: Run Astro check
        run: npm run check
        working-directory: web
        env:
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.JF_TURNSTILE_SITEKEY }}

      - name: Build static output
        run: npm run build
        working-directory: web
        env:
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.JF_TURNSTILE_SITEKEY }}

      - name: Verify contact endpoint staging
        shell: bash
        run: |
          set -euo pipefail
          test -f web/dist/api/contact.php
          cmp web/public/api/contact.php web/dist/api/contact.php

      - name: Upload PR review build
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: junkfeathers-astro-pr-build
          path: web/dist/
          retention-days: 5
          if-no-files-found: error
